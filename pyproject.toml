[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "src"
version = "0.0.1"
description = "Research on the impact of transport improvements, such as the Metro Cable, on the expansion of informal settlements into higher geographic risk areas in Latin American cities, using causal techniques, machine learning models, and computer vision."
authors = [
  { name = "Ignacio Sarmiento Barbieri - Juan Esteban Segura" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known_first_party = ["src"]
force_sort_within_sections = true
